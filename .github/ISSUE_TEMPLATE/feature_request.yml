name: ✨ Feature Request
description: Suggest a new feature or enhancement for SwiftX
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea for SwiftX! The more context you can give, the easier it is for us to evaluate and prioritize.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem? Describe what you're trying to do and what's currently getting in the way.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, features, or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area of the App
      description: Which part of SwiftX does this relate to?
      multiple: true
      options:
        - UI / Design
        - Performance
        - Sync / Backend
        - Notifications
        - Onboarding
        - Accessibility
        - Integrations
        - Other
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: Attach sketches, screenshots, or links to similar functionality in other apps, if helpful.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else you'd like to add.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/discussions to make sure this hasn't already been requested
          required: true
