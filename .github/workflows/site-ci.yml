name: Site CI

# Validates the landing site on pull requests. Without this, a broken site
# build is only discovered by pages.yml, which runs after the merge and
# deploys straight to production.
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Build static export
        run: npm run build

      # Catches a broken export before it can reach Pages: the entry point must
      # exist, and its assets must carry the /SwiftX prefix the project site is
      # served under.
      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html missing"; exit 1; }
          grep -q '"/SwiftX/_next/' out/index.html \
            || { echo "::error::assets are not prefixed with the /SwiftX base path"; exit 1; }
          echo "Export looks good."
