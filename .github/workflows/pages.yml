name: Deploy landing site

# Publishes site/out to GitHub Pages as a project site:
#   https://retrohazard.github.io/SwiftX/
# The /SwiftX base path comes from site/next.config.ts, which defaults to it —
# no build-time environment variable is needed here.
#
# This is a deploy, not a check, so it keeps its push trigger: ci.yml already
# linted and verified the same export on the pull request, and the build here
# is what actually produces the published artifact.
#
# Requires Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      # Without this a fix to the shared build/verify action would never reach
      # production until some unrelated site/** change came along.
      - ".github/actions/build-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Same action ci.yml runs, so the export that deploys is verified by the
      # same checks that gated the pull request. lint stays off by default: a
      # lint regression must not block publishing a site that builds correctly.
      - uses: ./.github/actions/build-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishing rights live here and nowhere else — the build job above cannot
    # deploy.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
