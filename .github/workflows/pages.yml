name: Deploy landing site

# Publishes site/out to GitHub Pages as a project site:
#   https://retrohazard.github.io/SwiftX/
# The /SwiftX base path comes from site/next.config.ts, which defaults to it —
# no build-time environment variable is needed here.
#
# Requires Settings -> Pages -> Source = "GitHub Actions". Pages is unavailable
# on a private repo unless the account has GitHub Pro/Team, so until this repo
# is public, run this manually via workflow_dispatch to check it, or expect the
# deploy job to fail at the API call.
on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Stops Pages' Jekyll pass from discarding the _next directory.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Fail before publishing rather than deploying a broken export.
      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          grep -q '"/SwiftX/_next/' out/index.html \
            || { echo "::error::assets are not prefixed with the /SwiftX base path"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
